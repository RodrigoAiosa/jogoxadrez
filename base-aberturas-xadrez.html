<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14181a">
<title>Base de Aberturas de Xadrez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14181a; --panel:#1c2225; --panel-2:#202729; --border:#2b3336;
  --text:#f1ece1; --text-dim:#8a9297;
  --amber:#e3a730; --amber-glow:rgba(227,167,48,0.28); --amber-soft:rgba(227,167,48,0.14);
  --red:#d6524a;
  --sq-light:#d9c9a6; --sq-dark:#7c5a3a;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{background:var(--bg); color:var(--text); font-family:'Fraunces',Georgia,serif; min-height:100vh;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
#app{max-width:720px; margin:0 auto; padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 24px);}
h1{font-size:22px; font-weight:700; margin:0 0 2px; text-align:center;}
.sub{font-size:12.5px; color:var(--text-dim); text-align:center; margin:0 0 18px; font-family:'JetBrains Mono',monospace;}
.searchbox{width:100%; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 16px;
  color:var(--text); font-size:15px; font-family:'JetBrains Mono',monospace; margin-bottom:12px;}
.searchbox::placeholder{color:var(--text-dim);}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
.chip{flex-shrink:0; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:7px 14px;
  font-size:12px; font-family:'JetBrains Mono',monospace; color:var(--text-dim); white-space:nowrap;}
.chip.active{border-color:var(--amber); background:var(--amber-glow); color:var(--amber);}
.count{font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-bottom:10px;}
.list{display:flex; flex-direction:column; gap:8px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 15px; text-align:left; width:100%; color:var(--text); font-family:inherit;}
.card:active{background:var(--panel-2); border-color:var(--amber);}
.card-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.card-name{font-size:15px; font-weight:600;}
.card-eco{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber); flex-shrink:0;}
.card-breadcrumb{font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:2px;}
.card-moves{font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.empty{text-align:center; color:var(--text-dim); font-size:13px; padding:30px 10px; font-family:'JetBrains Mono',monospace;}

/* overlay de detalhe */
.overlay{position:fixed; inset:0; background:rgba(20,24,26,0.97); z-index:30; display:none;
  flex-direction:column; overflow-y:auto; padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 24px);}
.overlay.show{display:flex;}
.closebtn{position:absolute; top:calc(var(--safe-t) + 14px); right:16px; background:var(--panel); border:1px solid var(--border);
  color:var(--text); width:36px; height:36px; border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center;}
.detail-title{font-size:21px; font-weight:700; margin:8px 40px 2px 0;}
.detail-eco{font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:13px; margin-bottom:2px;}
.detail-breadcrumb{font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-bottom:14px;}
.detail-idea{font-size:14.5px; line-height:1.5; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:16px;}
#miniBoard{display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
  width:min(78vw,320px); height:min(78vw,320px); margin:0 auto; border:3px solid var(--panel-2); border-radius:6px; overflow:hidden;}
.msq{position:relative; display:flex; align-items:center; justify-content:center;}
.msq.light{background:var(--sq-light);} .msq.dark{background:var(--sq-dark);}
.msq.hi{box-shadow:inset 0 0 0 3px rgba(227,167,48,0.6);}
.msq .p{font-size:min(6.5vw,26px); line-height:1; paint-order:stroke fill;}
.msq .p.white{color:#fffdf6; -webkit-text-stroke:1.2px #0c0c0c;}
.msq .p.black{color:#0c0a08; -webkit-text-stroke:1.2px #fff8ea;}
.stepper{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px;}
.stepbtn{background:var(--panel); border:1px solid var(--border); color:var(--text); width:40px; height:40px;
  border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center;}
.stepbtn:active{background:var(--panel-2);}
.stepbtn:disabled{opacity:0.35;}
.steplabel{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); min-width:60px; text-align:center;}
.movelist{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; justify-content:center;}
.movetag{font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--panel); border:1px solid var(--border);
  border-radius:8px; padding:5px 10px; color:var(--text-dim);}
.movetag.done{color:var(--text); border-color:var(--amber-glow); background:var(--amber-soft);}
.childrenlbl{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.5px; color:var(--text-dim); margin:20px 0 8px;}
.signature{font-size:11px; color:var(--text-dim); text-align:center; margin-top:20px; font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div id="app">
  <h1>♟️ Base de Aberturas de Xadrez</h1>
  <p class="sub">107 aberturas e contra-aberturas · pesquise por nome, código ECO ou lance</p>
  <input class="searchbox" id="searchBox" type="text" placeholder="Buscar: 'siciliana', 'C60', 'Nf3'…" inputmode="search">
  <div class="chips" id="familyChips"></div>
  <div class="count" id="resultCount"></div>
  <div class="list" id="list"></div>
  <p class="signature">Desenvolvido por Rodrigo Aiosa</p>
</div>

<div class="overlay" id="detailOverlay">
  <button class="closebtn" onclick="closeDetail()">✕</button>
  <div class="detail-eco" id="detailEco"></div>
  <div class="detail-title" id="detailTitle"></div>
  <div class="detail-breadcrumb" id="detailBreadcrumb"></div>
  <div class="detail-idea" id="detailIdea"></div>
  <div id="miniBoard"></div>
  <div class="stepper">
    <button class="stepbtn" id="stepPrev" onclick="stepMove(-1)">‹</button>
    <div class="steplabel" id="stepLabel">0/0</div>
    <button class="stepbtn" id="stepNext" onclick="stepMove(1)">›</button>
  </div>
  <div class="movelist" id="moveList"></div>
  <div id="childrenSection"></div>
</div>

<script>
/* ==================== MOTOR MÍNIMO (mesmo núcleo do jogo principal) ==================== */
const FILES='abcdefgh';
const GLYPH={w:{K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙'}, b:{K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'}};
const ROOK_DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const BISHOP_DIRS=[[1,1],[1,-1],[-1,1],[-1,-1]];
const KNIGHT_OFF=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
const KING_DIRS=[...ROOK_DIRS,...BISHOP_DIRS];
function inBounds(r,c){return r>=0&&r<8&&c>=0&&c<8;}
function opp(c){return c==='w'?'b':'w';}
function cloneBoard(b){return b.map(row=>row.slice());}
function freshBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  const back=['R','N','B','Q','K','B','N','R'];
  for(let c=0;c<8;c++){ b[0][c]={t:back[c],c:'w'}; b[1][c]={t:'P',c:'w'}; b[7][c]={t:back[c],c:'b'}; b[6][c]={t:'P',c:'b'}; }
  return b;
}
function isSquareAttacked(bd,r,c,byColor){
  for(const [dr,dc] of KNIGHT_OFF){ const nr=r+dr,nc=c+dc; if(inBounds(nr,nc)){const p=bd[nr][nc]; if(p&&p.c===byColor&&p.t==='N') return true;} }
  for(const [dr,dc] of KING_DIRS){ const nr=r+dr,nc=c+dc; if(inBounds(nr,nc)){const p=bd[nr][nc]; if(p&&p.c===byColor&&p.t==='K') return true;} }
  const pdir = byColor==='w' ? -1 : 1;
  for(const dc of [-1,1]){ const pr=r+pdir, pc=c+dc; if(inBounds(pr,pc)){const p=bd[pr][pc]; if(p&&p.c===byColor&&p.t==='P') return true;} }
  for(const [dr,dc] of ROOK_DIRS){ let nr=r+dr,nc=c+dc; while(inBounds(nr,nc)){ const p=bd[nr][nc]; if(p){ if(p.c===byColor&&(p.t==='R'||p.t==='Q')) return true; break;} nr+=dr;nc+=dc; } }
  for(const [dr,dc] of BISHOP_DIRS){ let nr=r+dr,nc=c+dc; while(inBounds(nr,nc)){ const p=bd[nr][nc]; if(p){ if(p.c===byColor&&(p.t==='B'||p.t==='Q')) return true; break;} nr+=dr;nc+=dc; } }
  return false;
}
function findKing(bd,color){ for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p=bd[r][c]; if(p&&p.c===color&&p.t==='K') return {r,c}; } return null; }
function isKingInCheck(bd,color){ const k=findKing(bd,color); return k ? isSquareAttacked(bd,k.r,k.c,opp(color)) : false; }
function generatePseudoMoves(bd,r,c,cast,ep){
  const piece=bd[r][c]; if(!piece) return [];
  const color=piece.c, o=opp(color); const moves=[];
  if(piece.t==='P'){
    const dir=color==='w'?1:-1, startRow=color==='w'?1:6, promoRow=color==='w'?7:0;
    const r1=r+dir;
    const addFwd=(tr,tc)=>{
      if(tr===promoRow){ for(const pp of ['Q','R','B','N']) moves.push({fromR:r,fromC:c,toR:tr,toC:tc,promo:pp,capture:false}); }
      else moves.push({fromR:r,fromC:c,toR:tr,toC:tc,capture:false});
    };
    if(inBounds(r1,c) && !bd[r1][c]){ addFwd(r1,c); if(r===startRow){ const r2=r+2*dir; if(!bd[r2][c]) moves.push({fromR:r,fromC:c,toR:r2,toC:c,flag:'double'}); } }
    for(const dc of [-1,1]){
      const nc=c+dc; if(!inBounds(r1,nc)) continue;
      const t=bd[r1][nc];
      if(t && t.c===o){ if(r1===promoRow){ for(const pp of ['Q','R','B','N']) moves.push({fromR:r,fromC:c,toR:r1,toC:nc,promo:pp,capture:true}); } else moves.push({fromR:r,fromC:c,toR:r1,toC:nc,capture:true}); }
      else if(ep && ep.r===r1 && ep.c===nc){ moves.push({fromR:r,fromC:c,toR:r1,toC:nc,flag:'ep',capture:true}); }
    }
  } else if(piece.t==='N'){
    for(const [dr,dc] of KNIGHT_OFF){ const nr=r+dr,nc=c+dc; if(!inBounds(nr,nc)) continue; const t=bd[nr][nc]; if(!t||t.c===o) moves.push({fromR:r,fromC:c,toR:nr,toC:nc,capture:!!t}); }
  } else if(piece.t==='B'||piece.t==='R'||piece.t==='Q'){
    const dirs = piece.t==='B'?BISHOP_DIRS : piece.t==='R'?ROOK_DIRS : KING_DIRS;
    for(const [dr,dc] of dirs){ let nr=r+dr,nc=c+dc; while(inBounds(nr,nc)){ const t=bd[nr][nc]; if(!t){ moves.push({fromR:r,fromC:c,toR:nr,toC:nc,capture:false}); } else { if(t.c===o) moves.push({fromR:r,fromC:c,toR:nr,toC:nc,capture:true}); break; } nr+=dr; nc+=dc; } }
  } else if(piece.t==='K'){
    for(const [dr,dc] of KING_DIRS){ const nr=r+dr,nc=c+dc; if(!inBounds(nr,nc)) continue; const t=bd[nr][nc]; if(!t||t.c===o) moves.push({fromR:r,fromC:c,toR:nr,toC:nc,capture:!!t}); }
    const row=color==='w'?0:7;
    if(r===row && c===4){
      const canK = color==='w'?cast.wK:cast.bK, canQ = color==='w'?cast.wQ:cast.bQ;
      if(canK && !bd[row][5] && !bd[row][6] && bd[row][7] && bd[row][7].t==='R' && bd[row][7].c===color){
        if(!isSquareAttacked(bd,row,4,o) && !isSquareAttacked(bd,row,5,o) && !isSquareAttacked(bd,row,6,o)) moves.push({fromR:r,fromC:c,toR:row,toC:6,flag:'O-O'});
      }
      if(canQ && !bd[row][1] && !bd[row][2] && !bd[row][3] && bd[row][0] && bd[row][0].t==='R' && bd[row][0].c===color){
        if(!isSquareAttacked(bd,row,4,o) && !isSquareAttacked(bd,row,3,o) && !isSquareAttacked(bd,row,2,o)) moves.push({fromR:r,fromC:c,toR:row,toC:2,flag:'O-O-O'});
      }
    }
  }
  return moves;
}
function simulateMove(bd,move){
  const nb=cloneBoard(bd);
  const piece=nb[move.fromR][move.fromC];
  nb[move.fromR][move.fromC]=null;
  if(move.flag==='ep') nb[move.fromR][move.toC]=null;
  nb[move.toR][move.toC]= move.promo ? {t:move.promo,c:piece.c} : piece;
  if(move.flag==='O-O'){ const row=move.fromR; nb[row][5]=nb[row][7]; nb[row][7]=null; }
  if(move.flag==='O-O-O'){ const row=move.fromR; nb[row][3]=nb[row][0]; nb[row][0]=null; }
  return nb;
}
function allLegalMovesForState(state,color){
  let all=[];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p=state.board[r][c]; if(!p||p.c!==color) continue;
    const pseudo=generatePseudoMoves(state.board,r,c,state.castling,state.epTarget);
    all=all.concat(pseudo.filter(m=>!isKingInCheck(simulateMove(state.board,m), p.c)));
  }
  return all;
}
function applyMoveToState(state,move){
  const bd=simulateMove(state.board,move);
  const castlingN={...state.castling};
  const piece=state.board[move.fromR][move.fromC];
  if(piece.t==='K'){ if(piece.c==='w'){castlingN.wK=false;castlingN.wQ=false;} else {castlingN.bK=false;castlingN.bQ=false;} }
  if(piece.t==='R'){
    if(move.fromR===0&&move.fromC===0) castlingN.wQ=false;
    if(move.fromR===0&&move.fromC===7) castlingN.wK=false;
    if(move.fromR===7&&move.fromC===0) castlingN.bQ=false;
    if(move.fromR===7&&move.fromC===7) castlingN.bK=false;
  }
  if(move.toR===0&&move.toC===0) castlingN.wQ=false;
  if(move.toR===0&&move.toC===7) castlingN.wK=false;
  if(move.toR===7&&move.toC===0) castlingN.bQ=false;
  if(move.toR===7&&move.toC===7) castlingN.bK=false;
  const epTargetN=(move.flag==='double') ? {r:(move.fromR+move.toR)/2, c:move.fromC} : null;
  return {board:bd, castling:castlingN, epTarget:epTargetN, turn:opp(state.turn)};
}
function sq(r,c){ return FILES[c]+String(r+1); }
function sanForMove(state, mv){
  if(mv.flag==='O-O') return 'O-O';
  if(mv.flag==='O-O-O') return 'O-O-O';
  const piece=state.board[mv.fromR][mv.fromC];
  const dest=sq(mv.toR,mv.toC);
  if(piece.t==='P'){
    let s = mv.capture ? (FILES[mv.fromC]+'x'+dest) : dest;
    if(mv.promo) s+='='+mv.promo;
    return s;
  }
  const rivals=[];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(r===mv.fromR && c===mv.fromC) continue;
    const p=state.board[r][c];
    if(p && p.c===piece.c && p.t===piece.t){
      const legal=allLegalMovesForState(state,piece.c).filter(m=>m.fromR===r&&m.fromC===c);
      if(legal.some(m=>m.toR===mv.toR && m.toC===mv.toC)) rivals.push({r,c});
    }
  }
  let dis='';
  if(rivals.length){
    const sameFile=rivals.some(o=>o.c===mv.fromC), sameRank=rivals.some(o=>o.r===mv.fromR);
    if(!sameFile) dis=FILES[mv.fromC]; else if(!sameRank) dis=String(mv.fromR+1); else dis=FILES[mv.fromC]+String(mv.fromR+1);
  }
  return piece.t+dis+(mv.capture?'x':'')+dest;
}
function resolveSAN(state, token){
  token = token.replace(/[+#!?]+$/,'');
  const legal = allLegalMovesForState(state, state.turn);
  for(const mv of legal){
    const san = sanForMove(state, mv).replace(/[+#]+$/,'');
    if(san===token) return mv;
  }
  return null;
}
// Reproduz uma abertura (string SAN) do início e devolve cada posição intermediária.
function replayOpening(movesStr){
  let state = {board:freshBoard(), castling:{wK:true,wQ:true,bK:true,bQ:true}, epTarget:null, turn:'w'};
  const snapshots=[{board:cloneBoard(state.board), lastMove:null, san:null}];
  const tokens = movesStr.trim().split(/\s+/);
  for(const tok of tokens){
    const mv = resolveSAN(state, tok);
    if(!mv) break;
    const san = sanForMove(state, mv);
    state = applyMoveToState(state, mv);
    snapshots.push({board:cloneBoard(state.board), lastMove:{fromR:mv.fromR,fromC:mv.fromC,toR:mv.toR,toC:mv.toC}, san});
  }
  return snapshots;
}

;
const BY_ID={}; OPENINGS.forEach(o=>BY_ID[o.id]=o);
function breadcrumb(op){
  const chain=[]; let cur=op;
  while(cur && cur.parent){ cur=BY_ID[cur.parent]; if(cur) chain.unshift(cur.name); }
  return chain;
}
const FAMILIES=['Todas','Abertas','Semiabertas','Fechadas','Indianas','Inglesa','Reti','Flanco','Gambitos','Raiz'];
const FAMILY_LABEL={Todas:'Todas', Abertas:'Abertas (1.e4 e5)', Semiabertas:'Semiabertas', Fechadas:'Fechadas (1.d4 d5)',
  Indianas:'Indianas', Inglesa:'Inglesa (1.c4)', Reti:'Réti (1.Nf3)', Flanco:'Flanco', Gambitos:'Gambitos', Raiz:'Sistemas-raiz'};

/* ==================== BUSCA / LISTAGEM ==================== */
let activeFamily='Todas', query='';
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function matches(op){
  if(activeFamily!=='Todas' && op.family!==activeFamily) return false;
  if(!query) return true;
  const q=normalize(query);
  return normalize(op.name).includes(q) || normalize(op.eco).includes(q) || normalize(op.moves).includes(q);
}
function renderChips(){
  const el=document.getElementById('familyChips'); el.innerHTML='';
  FAMILIES.forEach(f=>{
    const c=document.createElement('div');
    c.className='chip'+(f===activeFamily?' active':'');
    c.textContent=FAMILY_LABEL[f];
    c.onclick=()=>{ activeFamily=f; renderChips(); renderList(); };
    el.appendChild(c);
  });
}
function renderList(){
  const el=document.getElementById('list'); el.innerHTML='';
  const results = OPENINGS.filter(matches);
  document.getElementById('resultCount').textContent = `${results.length} resultado${results.length===1?'':'s'}`;
  if(!results.length){ el.innerHTML='<div class="empty">Nenhuma abertura encontrada. Tente outro termo.</div>'; return; }
  results.forEach(op=>{
    const card=document.createElement('button');
    card.className='card';
    const bc=breadcrumb(op);
    card.innerHTML=`<div class="card-top"><div class="card-name">${op.name}</div><div class="card-eco">${op.eco}</div></div>
      ${bc.length?`<div class="card-breadcrumb">${bc.join(' → ')}</div>`:''}
      <div class="card-moves">${op.moves}</div>`;
    card.onclick=()=>openDetail(op.id);
    el.appendChild(card);
  });
}
document.getElementById('searchBox').addEventListener('input', e=>{ query=e.target.value; renderList(); });

/* ==================== DETALHE + MINI TABULEIRO ==================== */
let curSnapshots=[], curStep=0;
function openDetail(id){
  const op=BY_ID[id];
  document.getElementById('detailEco').textContent=op.eco;
  document.getElementById('detailTitle').textContent=op.name;
  const bc=breadcrumb(op);
  document.getElementById('detailBreadcrumb').textContent = bc.length ? ('Deriva de: '+bc.join(' → ')) : 'Sistema-raiz';
  document.getElementById('detailIdea').textContent=op.idea;
  curSnapshots = replayOpening(op.moves);
  curStep = curSnapshots.length-1;
  renderMiniBoard();
  renderMoveList(op);
  renderChildren(op);
  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('detailOverlay').scrollTop=0;
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }
function stepMove(delta){
  curStep=Math.max(0, Math.min(curSnapshots.length-1, curStep+delta));
  renderMiniBoard();
}
function renderMiniBoard(){
  const snap=curSnapshots[curStep];
  const el=document.getElementById('miniBoard'); el.innerHTML='';
  for(let dr=0;dr<8;dr++) for(let dc=0;dc<8;dc++){
    const r=7-dr, c=dc;
    const sqEl=document.createElement('div');
    sqEl.className='msq '+(((r+c)%2===0)?'dark':'light');
    if(snap.lastMove && ((snap.lastMove.fromR===r&&snap.lastMove.fromC===c)||(snap.lastMove.toR===r&&snap.lastMove.toC===c))) sqEl.classList.add('hi');
    const piece=snap.board[r][c];
    if(piece){ const sp=document.createElement('span'); sp.className='p '+(piece.c==='w'?'white':'black'); sp.textContent=GLYPH[piece.c][piece.t]; sqEl.appendChild(sp); }
    el.appendChild(sqEl);
  }
  document.getElementById('stepLabel').textContent=`${curStep}/${curSnapshots.length-1}`;
  document.getElementById('stepPrev').disabled = curStep===0;
  document.getElementById('stepNext').disabled = curStep===curSnapshots.length-1;
}
function renderMoveList(op){
  const el=document.getElementById('moveList'); el.innerHTML='';
  curSnapshots.slice(1).forEach((s,i)=>{
    const tag=document.createElement('div');
    tag.className='movetag'+(i+1<=curStep?' done':'');
    const moveNum = Math.floor(i/2)+1;
    tag.textContent = (i%2===0?moveNum+'.':'') + s.san;
    tag.onclick=()=>{ curStep=i+1; renderMiniBoard(); };
    el.appendChild(tag);
  });
}
function renderChildren(op){
  const kids = OPENINGS.filter(o=>o.parent===op.id);
  const section=document.getElementById('childrenSection');
  if(!kids.length){ section.innerHTML=''; return; }
  section.innerHTML = `<div class="childrenlbl">CONTRA-ABERTURAS / VARIANTES A PARTIR DAQUI</div>`;
  const list=document.createElement('div'); list.className='list';
  kids.forEach(k=>{
    const card=document.createElement('button');
    card.className='card';
    card.innerHTML=`<div class="card-top"><div class="card-name">${k.name}</div><div class="card-eco">${k.eco}</div></div><div class="card-moves">${k.moves}</div>`;
    card.onclick=()=>openDetail(k.id);
    list.appendChild(card);
  });
  section.appendChild(list);
}

renderChips();
renderList();
</script>
